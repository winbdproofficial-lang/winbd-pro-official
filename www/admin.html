<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINBD-PRO Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#061f16;color:#fff;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:24px}.box{background:#0a442f;border:1px solid #ffffff18;border-radius:16px;padding:20px;margin:14px 0}input,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border-radius:8px;border:1px solid #ffffff20;background:#ffffff0b;color:#fff}button{padding:10px 15px;border:0;border-radius:8px;background:#f5c518;color:#061f16;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.num{font-size:30px;color:#f5c518}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff12}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><div id="login" class="box"><h1>WINBD-PRO Admin</h1><p>Supabase account দিয়ে admin login করুন।</p><form onsubmit="signin(event)"><input id="email" type="email" required placeholder="Admin email"><input id="password" type="password" required placeholder="Password"><button>প্রবেশ করুন</button></form><p id="msg"></p></div><div id="app" hidden><div class="box"><h1>WINBD-PRO Control Panel</h1><div class="grid"><div><b id="users" class="num">0</b><br>Users</div><div><b id="gameCount" class="num">0</b><br>Games</div><div><b id="bonus" class="num">100</b><br>Daily bonus</div></div></div><div class="box"><h2>Game Management</h2><form onsubmit="addGame(event)"><input id="name" required placeholder="Game name"><select id="category"><option>স্লট</option><option>কার্ড</option><option>স্পিন</option><option>ফিশিং</option><option>আর্কেড</option></select><input id="icon" maxlength="4" placeholder="Icon e.g. 🎮"><button>গেম যোগ করুন</button></form><div id="gameList"></div></div><div class="box"><h2>Daily Bonus</h2><input id="bonusInput" type="number" min="0" value="100"><button onclick="saveBonus()">সংরক্ষণ</button></div><div class="box"><button onclick="signout()">লগআউট</button></div></div><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);async function signin(e){e.preventDefault();msg.textContent='অপেক্ষা করুন...';const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}await boot()}async function boot(){const {data:{user}}=await db.auth.getUser();if(!user){return}const {data:p}=await db.from('profiles').select('role').eq('id',user.id).single();if(!p||p.role!=='admin'){await db.auth.signOut();msg.textContent='এই account-এর admin access নেই।';return}login.hidden=true;app.hidden=false;await draw()}async function draw(){const {count:u}=await db.from('profiles').select('*',{count:'exact',head:true});const {data:g}=await db.from('games').select('*').order('created_at',{ascending:false});users.textContent=u??0;gameCount.textContent=g?.length??0;gameList.innerHTML=(g||[]).map(x=>`<div class="row"><span>${x.icon||'🎮'} ${x.name} — ${x.category}</span><button onclick="toggleGame('${x.id}',${!x.enabled})">${x.enabled?'Disable':'Enable'}</button></div>`).join('')||'<p>কোনো game নেই।</p>';const {data:r}=await db.from('reward_settings').select('value').eq('key','daily_bonus').maybeSingle();bonusInput.value=Number(r?.value||100);bonus.textContent=bonusInput.value}async function addGame(e){e.preventDefault();const {error}=await db.from('games').insert({name:name.value,category:category.value,icon:icon.value||'🎮'});if(error)alert(error.message);else{e.target.reset();await draw()}}async function toggleGame(id,enabled){const {error}=await db.from('games').update({enabled}).eq('id',id);if(error)alert(error.message);else draw()}async function saveBonus(){const v=Math.max(0,Number(bonusInput.value));const {error}=await db.from('reward_settings').upsert({key:'daily_bonus',value:v});if(error)alert(error.message);else draw()}async function signout(){await db.auth.signOut();location.reload()}boot()</script></main></body></html>
